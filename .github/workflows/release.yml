name: Publish plugin release

on:
  push:
    branches: [main]
    paths:
      - manifest.json
      - .github/workflows/release.yml
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run package:release
      - run: npm run verify:registry
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/release/main.js
            dist/release/manifest.json
            dist/release/styles.css
      - name: Verify release attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh attestation verify dist/release/main.js --repo "$GITHUB_REPOSITORY"
          gh attestation verify dist/release/manifest.json --repo "$GITHUB_REPOSITORY"
          gh attestation verify dist/release/styles.css --repo "$GITHUB_REPOSITORY"
      - name: Publish exact-version release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8')).version")
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; leaving its assets unchanged."
            exit 0
          fi
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file RELEASE_NOTES.md \
            dist/release/main.js dist/release/manifest.json dist/release/styles.css
